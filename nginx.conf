events {}

http {
    include       mime.types;
    default_type  application/octet-stream;

    server {
        listen 80;

        # The Qwik node server (pages, endpoints, static files)
        location / {
            proxy_pass http://localhost:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Socket.IO to oceano-core (IoT and infra live updates). The browser connects same-origin.
        # oceano-core's Coolify network alias on on-prem (both apps share that server's network).
        # Resolved per request through Docker's DNS, so nginx still starts when the name doesn't
        # resolve (e.g. a plain `docker run`); /socket.io then answers 502 and the rest works.
        location /socket.io {
            resolver 127.0.0.11 valid=30s ipv6=off;
            set $oceano_core oceano-core-production:3000;
            proxy_pass http://$oceano_core;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
